services:
  postgres:
    image: postgres:16-alpine
    container_name: dentalops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dentalops
      POSTGRES_PASSWORD: dentalops_pass
      POSTGRES_DB: dentalops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentalops -d dentalops"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dentalops-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dentalops:dentalops_pass@postgres:5432/dentalops
      JWT_SECRET: change-me-in-production
      PORT: 5000
      ML_SERVICE_URL: http://localhost:8000
    ports:
      - "5000:5000"

volumes:
  postgres_data:
